[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "google-rank-tracker"
version = "0.1.0"
description = "Daily Google rank tracker: position changes, competitor overtakes and AI Overview citations in Slack, Discord or a webhook, a weekly digest, SQLite history and a GitHub Pages chart, on a GitHub Actions schedule."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "ScrapeUnblocker" }]
keywords = [
    "rank-tracker",
    "serp",
    "seo",
    "google-rankings",
    "keyword-tracking",
    "ai-overview",
    "slack",
    "discord",
    "github-actions",
    "github-pages",
    "sqlite",
    "scrapeunblocker",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "scrapeunblocker>=0.19,<1",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.5",
]

[project.urls]
Homepage = "https://scrapeunblocker.com/?utm_source=github&utm_medium=integration&utm_campaign=example-repos"
Documentation = "https://docs.scrapeunblocker.com/?utm_source=github&utm_medium=integration&utm_campaign=example-repos"
Repository = "https://github.com/ScrapeUnblocker/google-rank-tracker"
Issues = "https://github.com/ScrapeUnblocker/google-rank-tracker/issues"

[project.scripts]
google-rank-tracker = "google_rank_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["state", "site"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
