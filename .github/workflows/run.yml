name: Track rankings

on:
  schedule:
    # Once a day, 06:23 UTC. GitHub can start scheduled runs a few minutes late.
    # A keyword is searched at most once per UTC day, so an extra run costs nothing.
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print what would be delivered, send nothing, save nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rank-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # commit state/ranks.db, the history
      pages: read # see whether GitHub Pages is on, to publish the chart page
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check for the API key
        id: gate
        env:
          SCRAPEUNBLOCKER_KEY: ${{ secrets.SCRAPEUNBLOCKER_KEY }}
        run: |
          if [ -z "$SCRAPEUNBLOCKER_KEY" ]; then
            echo "::notice title=Not set up yet::Add the SCRAPEUNBLOCKER_KEY repository secret (Settings > Secrets and variables > Actions) to start tracking. Nothing was checked."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.ready == 'true'

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        if: steps.gate.outputs.ready == 'true'
        run: python -m pip install .

      - name: Is GitHub Pages on?
        id: pages
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq 'select(.build_type == "workflow") | .html_url' 2>/dev/null || true)
          if [ -n "$url" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "The chart page goes to $url"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is off (Settings > Pages > Source: GitHub Actions turns it on). The chart page is not published."
          fi

      - name: Check rankings and deliver changes
        if: steps.gate.outputs.ready == 'true'
        env:
          SCRAPEUNBLOCKER_KEY: ${{ secrets.SCRAPEUNBLOCKER_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          RANK_REPORT_URL: ${{ steps.pages.outputs.url }}
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: google-rank-tracker run $DRY_RUN_FLAG

      - name: Build the chart page
        if: ${{ !cancelled() && steps.gate.outputs.ready == 'true' }}
        run: google-rank-tracker report --out site

      - name: Commit the history
        if: ${{ !cancelled() && steps.gate.outputs.ready == 'true' && !inputs.dry_run }}
        run: |
          git add state/
          if git diff --cached --quiet; then
            echo "Nothing new in the history; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update rank history [skip ci]"
          git pull --rebase
          git push

      - name: Upload the chart page
        if: ${{ !cancelled() && steps.pages.outputs.enabled == 'true' && !inputs.dry_run }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  pages:
    needs: track
    if: ${{ !cancelled() && needs.track.outputs.pages == 'true' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the chart page
      id-token: write # required by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the chart page
        id: deployment
        uses: actions/deploy-pages@v5
